<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
</head>
<body class="container">
    <h1 class="mt-2">Socket Client</h1>
    <hr>
    <p>
        Your socket ID is: <span id="socket-id">...</span>
        <br>
        Server Status: 
        <span id="server-status-online" class="badge bg-success">Online</span>
        <span id="server-status-offline" class="badge bg-danger">Offline</span>
    </p>

    <div class="row">
            <h3>Send Message to Server</h3>
            <form id="message-form">
                <div class="col-6 mb-3">
                    <label id="lbl-message" for="txt-message" class="form-label">Message:</label>
                    <input id="txt-message" type="text" class="form-control" autocomplete="off">      
                </div>
                <div class="col-6"></div>
                <div class="col-12">    
                    <div class="mb-3">
                        <button id="btn-send" type="button" class="btn btn-primary me-2">Send</button>
                        <button id="btn-submit" type="submit" class="btn btn-primary me-2">Submit</button>
                        <button id="btn-send-private" type="button" class="btn btn-primary">Send Private</button>
                    </div>
                </div>
            </form>
    </div>

    <script src="./socket.io/socket.io.js"></script>
    <script src="./js/socket-client.js"></script>
</body>
</html>
